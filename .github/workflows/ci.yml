name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      continue-on-error: true
        
    - name: Check for changes
      id: changes
      uses: dorny/paths-filter@v2
      with:
        filters: |
          docker:
            - 'Dockerfile'
            - 'Dockerfile.test'
            - 'requirements.txt'
            - 'requirements-test.txt'
            - 'pyproject.toml'
          python:
            - 'python/**'
            - 'tests/**'
            
    - name: Build and push main Docker image
      if: steps.changes.outputs.docker == 'true'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: suizer98/rinexpos:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Prepare test image for container
      run: |
        echo "Attempting to pull test image from registry..."
        docker pull suizer98/python-test-kit:latest || echo "Test image not found in registry, will build locally"
        
        if ! docker image inspect suizer98/python-test-kit:latest >/dev/null 2>&1; then
          echo "Building test image locally..."
          docker build -f Dockerfile.test -t suizer98/python-test-kit:latest .
        else
          echo "Test image is available from registry"
        fi
        
    - name: Run complete test suite in container
      run: |
        docker compose --profile test run test
      env:
        SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

    - name: Prepare main image for processing
      run: |
        echo "Attempting to pull main image from registry..."
        docker pull suizer98/rinexpos:latest || echo "Main image not found in registry, will build locally"

        if ! docker image inspect suizer98/rinexpos:latest >/dev/null 2>&1; then
          echo "Building main image locally..."
          docker compose build rinexpos
        else
          echo "Main image is available from registry"
        fi

    - name: Run processing and verify output
      run: |
        mkdir -p results
        chmod -R a+rwX results

        docker compose run --rm --user root rinexpos \
          python3 python/main.py \
          --file=data/brdc0680.20n --date=20,3,8 --interval=3600 --plot --max_epochs=24

        echo "=== results/ ==="
        ls -la results/

        test -f results/brdc0680_ecef.csv
        test -f results/brdc0680_latlonalt.csv
        test -f results/brdc0680_ecef.png

        echo "Output files verified"

