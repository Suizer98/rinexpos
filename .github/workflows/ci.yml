name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      continue-on-error: true
        
    - name: Check for changes
      id: changes
      uses: dorny/paths-filter@v2
      with:
        filters: |
          docker:
            - 'Dockerfile'
            - 'Dockerfile.test'
            - 'requirements.txt'
            - 'requirements-test.txt'
            - 'pyproject.toml'
          python:
            - 'python/**'
            - 'tests/**'
            
    - name: Build and push main Docker image
      if: steps.changes.outputs.docker == 'true'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: suizer98/rinexpos:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Prepare test image for container
      run: |
        echo "Attempting to pull test image from registry..."
        docker pull suizer98/python-test-kit:latest || echo "Test image not found in registry, will build locally"
        
        if ! docker image inspect suizer98/python-test-kit:latest >/dev/null 2>&1; then
          echo "Building test image locally..."
          docker build -f Dockerfile.test -t suizer98/python-test-kit:latest .
        else
          echo "Test image is available from registry"
        fi
      continue-on-error: true
        
    - name: Run complete test suite in container
      run: |
        docker compose --profile test run test
      env:
        SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      continue-on-error: true
        
    # - name: Test static plotting
    #   run: |
    #     # Test static plot generation
    #     docker compose run --rm rinexpos python3 python/plot_satellites.py results/chur1610_python.csv --max_epochs=100
        
    - name: Verify output files
      run: |
        ls -la results/
        test -f results/chur1610_python.png
        
